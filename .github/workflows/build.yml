name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Schriftart Russo One laden
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 -o app/src/main/res/font/russo_one.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/russoone/RussoOne-Regular.ttf
          test -s app/src/main/res/font/russo_one.ttf

      - name: Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: APK erstellen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bildgestalter-APK
          path: app/build/outputs/apk/debug/app-debug.apk
